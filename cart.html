<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart | GhorCast</title>

    <meta name="description"
          content="Review your selected travel products and continue to checkout on GhorCast.">

    <link rel="stylesheet" href="style.css">

    <style>

        /* ================================
           GHORCAST SHOPPING CART
        ================================= */

        .logo a {
    text-decoration: none;
}

.logo a span {
    color: #17202a;
}

.logo a strong {
    color: #c79a4b;
}

        .cart-page {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 20px 80px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 25px;
            color: #c99a45;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .cart-page h1 {
            color: #17202a;
            margin-bottom: 30px;
            font-size: 36px;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
            align-items: start;
        }

        /* CART ITEMS */

        .cart-items {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 8px 30px rgba(0,0,0,.07);
        }

        .cart-item {
            display: grid;
            grid-template-columns: 110px 1fr auto;
            gap: 20px;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item:first-child {
            padding-top: 0;
        }

        .cart-item:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .cart-item-image {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 12px;
            background: #f5f5f5;
        }

        .cart-item-info h3 {
            margin: 0 0 8px;
            color: #17202a;
            font-size: 20px;
        }

        .cart-item-price {
            color: #c99a45;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            width: fit-content;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }

        .quantity-control button {
            width: 38px;
            height: 38px;
            border: none;
            background: #f5f5f5;
            cursor: pointer;
            font-size: 20px;
        }

        .quantity-control button:hover {
            background: #eaeaea;
        }

        .quantity-control span {
            width: 45px;
            text-align: center;
            font-weight: 600;
        }

        .cart-item-total {
            text-align: right;
        }

        .item-total-price {
            color: #17202a;
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .remove-button {
            border: none;
            background: transparent;
            color: #c0392b;
            cursor: pointer;
            font-weight: 600;
        }

        .remove-button:hover {
            text-decoration: underline;
        }

        /* EMPTY CART */

        .empty-cart {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-cart-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .empty-cart h2 {
            color: #17202a;
            margin-bottom: 10px;
        }

        .empty-cart p {
            color: #777;
            margin-bottom: 25px;
        }

        .shop-button {
            display: inline-block;
            background: #c99a45;
            color: white;
            padding: 13px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
        }

        .shop-button:hover {
            opacity: .9;
        }

        /* ORDER SUMMARY */

        .cart-summary {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 8px 30px rgba(0,0,0,.07);
            position: sticky;
            top: 20px;
        }

        .cart-summary h2 {
            margin-top: 0;
            color: #17202a;
            margin-bottom: 25px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 15px 0;
            color: #555;
        }

        .summary-row.total {
            border-top: 1px solid #eee;
            padding-top: 18px;
            margin-top: 20px;
            color: #17202a;
            font-size: 21px;
            font-weight: 800;
        }

        .checkout-button {
            width: 100%;
            border: none;
            background: #c99a45;
            color: white;
            padding: 15px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 800;
            margin-top: 20px;
        }

        .checkout-button:hover {
            opacity: .9;
        }

        .continue-shopping {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #17202a;
            text-decoration: none;
            font-weight: 600;
        }

        .continue-shopping:hover {
            text-decoration: underline;
        }

        .shipping-note {
            margin-top: 20px;
            padding: 15px;
            background: #f8f8f8;
            border-radius: 10px;
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        /* TOAST */

        .cart-message {
            position: fixed;
            right: 20px;
            bottom: 20px;
            background: #17202a;
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,.2);
            display: none;
            z-index: 9999;
        }

        /* MOBILE */

        @media (max-width: 850px) {

            .cart-layout {
                grid-template-columns: 1fr;
            }

            .cart-summary {
                position: static;
            }

        }

        @media (max-width: 600px) {

            .cart-page {
                margin-top: 30px;
            }

            .cart-page h1 {
                font-size: 30px;
            }

            .cart-items {
                padding: 18px;
            }

            .cart-item {
                grid-template-columns: 80px 1fr;
                gap: 15px;
            }

            .cart-item-image {
                width: 80px;
                height: 80px;
            }

            .cart-item-total {
                grid-column: 2;
                text-align: left;
            }

            .item-total-price {
                margin-bottom: 8px;
            }

        }

    </style>
</head>

<body>

<header>

    <div class="container">

        <div class="logo">
    <a href="index.html">
        GHOR<strong>CAST</strong> SHOP
    </a>
</div>

        <nav class="navigation">
    <a href="products.html">Home</a>
    <a href="messages.html">Messages</a>
    <a href="account.html">Account</a>
</nav>

    </div>

</header>


<main class="cart-page">

    <a href="products.html" class="back-link">
        ← Continue Shopping
    </a>

    <h1>
        🛒 Your Shopping Cart
    </h1>


    <div class="cart-layout">

        <!-- CART PRODUCTS -->

        <section
            id="cartItems"
            class="cart-items">
        </section>


        <!-- ORDER SUMMARY -->

        <aside
            id="cartSummary"
            class="cart-summary">

            <h2>
                Order Summary
            </h2>

            <div class="summary-row">

                <span>
                    Subtotal
                </span>

                <strong id="subtotal">
                    $0.00
                </strong>

            </div>

            <div class="summary-row">

                <span>
                    Shipping
                </span>

                <strong id="shipping">
                    Calculated at checkout
                </strong>

            </div>

            <div class="summary-row total">

                <span>
                    Total
                </span>

                <strong id="total">
                    $0.00
                </strong>

            </div>


            <button
                type="button"
                class="checkout-button"
                onclick="proceedToCheckout()">

                Proceed to Checkout →

            </button>


            <a
                href="products.html"
                class="continue-shopping">

                ← Continue Shopping

            </a>


            <div class="shipping-note">

                🚚 Shipping cost and delivery
                availability will be confirmed
                during checkout.

            </div>

        </aside>

    </div>

</main>


<div
    id="cartMessage"
    class="cart-message">
</div>


<footer>

    <div class="container">

        <p>
            © 2026 GhorCast. All rights reserved.
        </p>

    </div>

</footer>


<script>

    /* ================================
       LOAD CART
    ================================= */

    let cart =
        JSON.parse(
            localStorage.getItem("ghorcastCart") || "[]"
        );


    /* ================================
       DISPLAY CART
    ================================= */

    function renderCart() {

        const cartItems =
            document.getElementById("cartItems");

        const cartSummary =
            document.getElementById("cartSummary");


        if (cart.length === 0) {

            cartItems.innerHTML = `

                <div class="empty-cart">

                    <div class="empty-cart-icon">
                        🛒
                    </div>

                    <h2>
                        Your cart is empty
                    </h2>

                    <p>
                        You haven't added any travel
                        products yet.
                    </p>

                    <a
                        href="products.html"
                        class="shop-button">

                        Explore Products

                    </a>

                </div>

            `;

            document.getElementById("subtotal")
                .textContent = "$0.00";

            document.getElementById("total")
                .textContent = "$0.00";

            return;

        }


        let subtotal = 0;


        cartItems.innerHTML = "";


        cart.forEach((item, index) => {

            const itemTotal =
                item.price * item.quantity;


            subtotal += itemTotal;


            const itemElement =
                document.createElement("div");


            itemElement.className =
                "cart-item";


            itemElement.innerHTML = `

                <img
                    class="cart-item-image"
                    src="${item.image}"
                    alt="${item.name}"
                >


                <div class="cart-item-info">

                    <h3>
                        ${item.name}
                    </h3>

                    <div class="cart-item-price">
                        $${Number(item.price).toFixed(2)}
                    </div>


                    <div class="quantity-control">

                        <button
                            type="button"
                            onclick="changeCartQuantity(${index}, -1)">
                            −
                        </button>

                        <span>
                            ${item.quantity}
                        </span>

                        <button
                            type="button"
                            onclick="changeCartQuantity(${index}, 1)">
                            +
                        </button>

                    </div>

                </div>


                <div class="cart-item-total">

                    <div class="item-total-price">
                        $${itemTotal.toFixed(2)}
                    </div>

                    <button
                        type="button"
                        class="remove-button"
                        onclick="removeItem(${index})">

                        Remove

                    </button>

                </div>

            `;


            cartItems.appendChild(itemElement);

        });


        document.getElementById("subtotal")
            .textContent =
            "$" + subtotal.toFixed(2);


        document.getElementById("total")
            .textContent =
            "$" + subtotal.toFixed(2);

    }


    /* ================================
       CHANGE QUANTITY
    ================================= */

    function changeCartQuantity(index, amount) {

        cart[index].quantity += amount;


        if (cart[index].quantity < 1) {

            cart[index].quantity = 1;

        }


        saveCart();

        renderCart();

    }


    /* ================================
       REMOVE PRODUCT
    ================================= */

    function removeItem(index) {

        const removedProduct =
            cart[index].name;


        cart.splice(index, 1);


        saveCart();

        renderCart();


        showMessage(
            removedProduct +
            " removed from cart."
        );

    }


    /* ================================
       SAVE CART
    ================================= */

    function saveCart() {

        localStorage.setItem(
            "ghorcastCart",
            JSON.stringify(cart)
        );

    }


    /* ================================
       CHECKOUT
    ================================= */

    function proceedToCheckout() {

        if (cart.length === 0) {

            showMessage(
                "Your cart is empty."
            );

            return;

        }


        /*
         * Save the current cart so the
         * checkout page can use it.
         */

        localStorage.setItem(
            "ghorcastCheckoutCart",
            JSON.stringify(cart)
        );


        window.location.href =
            "checkout.html";

    }


    /* ================================
       MESSAGE
    ================================= */

    function showMessage(message) {

        const messageBox =
            document.getElementById("cartMessage");


        messageBox.textContent =
            message;


        messageBox.style.display =
            "block";


        setTimeout(() => {

            messageBox.style.display =
                "none";

        }, 2500);

    }


    /* ================================
       INITIAL LOAD
    ================================= */

    renderCart();

</script>

</body>
</html>
