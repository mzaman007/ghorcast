           SAUDI ARABIA PAGE

        .saudi-hero {
            min-height: 500px;
            display: flex;
            align-items: center;
            position: relative;
            background:
                linear-gradient(
                    rgba(15, 22, 30, 0.72),
                    rgba(15, 22, 30, 0.82)
                ),
                url("https://commons.wikimedia.org/wiki/Special:FilePath/Elephant%20rock%20Al%20Ula,%20Saudi%20Arabia%202011.jpg?width=1600")
                center/cover no-repeat;
        }

        .saudi-hero-content {
            max-width: 850px;
            padding: 80px 20px;
            color: #ffffff;
        }

        .saudi-hero-content span {
            display: inline-block;
            margin-bottom: 15px;
            color: #e0b866;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .saudi-hero-content h1 {
            font-size: clamp(40px, 6vw, 72px);
            margin: 0 0 20px;
            line-height: 1.05;
        }

        .saudi-hero-content p {
            font-size: 18px;
            line-height: 1.8;
            max-width: 750px;
            margin-bottom: 30px;
        }

        .saudi-button {
            display: inline-block;
            padding: 13px 24px;
            background: #c79a4b;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 700;
            transition: 0.3s;
        }

        .saudi-button:hover {
            background: #b1853e;
            transform: translateY(-2px);
        }

        .saudi-intro {
            max-width: 900px;
            margin: 0 auto;
            text-align: center;
        }

        .saudi-intro p {
            line-height: 1.9;
            color: #555;
        }

        .saudi-section-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .saudi-section-title h2 {
            margin-bottom: 10px;
        }

        .saudi-section-title p {
            color: #666;
            max-width: 700px;
            margin: auto;
            line-height: 1.7;
        }

        .saudi-place-grid,
        .saudi-food-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .saudi-place-card,
        .saudi-food-card {
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            transition: transform 0.3s ease;
        }

        .saudi-place-card:hover,
        .saudi-food-card:hover {
            transform: translateY(-5px);
        }

        .saudi-place-image,
        .saudi-food-image {
            height: 220px;
            background:
                linear-gradient(
                    135deg,
                    #d7c4a0,
                    #8d7652
                );
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }

        .saudi-place-image span,
        .saudi-food-image span {
            font-size: 14px;
            font-weight: 700;
            opacity: 0.9;
        }

        .saudi-card-content {
            padding: 24px;
        }

        .saudi-card-content h3 {
            margin-top: 0;
            margin-bottom: 10px;
        }

        .saudi-card-content p {
            color: #666;
            line-height: 1.7;
            margin-bottom: 12px;
        }

        .saudi-location {
            display: block;
            color: #b1853e;
            font-size: 14px;
            font-weight: 700;
        }

        .saudi-info-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .saudi-info-card {
            background: #f8f6f1;
            padding: 30px;
            border-radius: 12px;
            border-left: 4px solid #c79a4b;
        }

        .saudi-info-card h3 {
            margin-top: 0;
        }

        .saudi-info-card p {
            color: #666;
            line-height: 1.7;
        }
