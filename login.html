<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhorCast | Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js" defer></script>
</head>
<body class="auth-page">
    <main class="auth-container">
        <a href="index.html" class="auth-logo"><span>Ghor</span><strong>Cast</strong></a>
        <div class="auth-card">
            <p class="eyebrow">WELCOME BACK</p>
            <h1>Sign in</h1>
            <p class="auth-subtitle">Access your GhorCast account.</p>

            <div id="authMessage" class="auth-message" hidden></div>

            <form id="loginForm">
                <label for="email">Email</label>
                <input id="email" type="email" autocomplete="email" required>

                <label for="password">Password</label>
                <input id="password" type="password" autocomplete="current-password" required>

                <button class="primary-button auth-submit" type="submit">Sign In</button>
            </form>

            <p class="auth-switch">Don't have an account? <a href="register.html">Create one</a></p>
        </div>
    </main>
</body>
</html>
