<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Istanbul Grand Stay | GhorCast</title><link rel="stylesheet" href="style.css"><style>.detail{padding:70px 0}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:40px}.photo{min-height:520px;border-radius:24px;background:url('https://images.unsplash.com/photo-1551882547-ff40c63fe5fa?auto=format&fit=crop&w=1400&q=85') center/cover}.box{background:#fff;padding:35px;border-radius:24px;box-shadow:0 15px 45px rgba(0,0,0,.1)}.box h1{margin:8px 0}.meta{color:#777;line-height:1.8}.book{display:block;text-align:center;background:#17202a;color:#fff;padding:15px;border-radius:10px;text-decoration:none;margin-top:22px;border:0;width:100%;cursor:pointer;font-size:16px}.fields{display:grid;gap:12px;margin-top:20px}.fields label{font-size:13px;font-weight:600}.fields input,.fields select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:9px;margin-top:6px}@media(max-width:800px){.grid{grid-template-columns:1fr}.photo{min-height:350px}}</style></head><body><header class="header"><div class="container nav-container"><a href="index.html" class="logo"><span>Ghor</span><strong>Cast</strong></a><nav class="navigation"><a href="hotels.html">Hotels</a><a href="deals.html">Deals</a><a href="destinations.html">Destinations</a><a href="news.html">News</a><a href="articles.html">Articles</a></nav><button class="menu-button" id="menuButton">☰</button></div></header><section class="detail"><div class="container grid"><div class="photo"></div><div class="box"><p class="eyebrow">ISTANBUL, TURKEY</p><h1>Istanbul Grand Stay</h1><div class="rating">★★★★★ <span>4.7</span></div><p class="meta">Discover comfortable accommodation in the heart of Istanbul, close to the city's historic attractions and experiences.</p><h3>Choose your room</h3><select id="room"><option value="Classic Room|85">Classic Room — $85/night</option><option value="City View Room|110">City View Room — $110/night</option><option value="Grand Suite|155">Grand Suite — $155/night</option></select><div class="fields"><label>Check-in<input type="date" id="checkIn"></label><label>Check-out<input type="date" id="checkOut"></label><label>Guests<input type="number" id="guests" min="1" value="2"></label></div><button class="book" onclick="continueBooking()">Continue to Booking</button><a href="hotels.html" style="display:block;text-align:center;margin-top:15px;color:#777">← Back to Hotels</a></div></div></section><script>const t=new Date().toISOString().split('T')[0],ci=document.getElementById('checkIn'),co=document.getElementById('checkOut');ci.min=t;co.min=t;ci.onchange=()=>co.min=ci.value||t;function continueBooking(){if(!ci.value||!co.value)return alert('Please select your check-in and check-out dates.');if(new Date(co.value)<=new Date(ci.value))return alert('Check-out must be after check-in.');const[r,p]=room.value.split('|'),n=Math.round((new Date(co.value)-new Date(ci.value))/86400000);localStorage.setItem('ghorcastBooking',JSON.stringify({hotel:'Istanbul Grand Stay',location:'Istanbul, Turkey',checkIn:ci.value,checkOut:co.value,guests:+guests.value,room:r,pricePerNight:+p,nights:n,total:n*+p}));location.href='booking.html'}const b=document.getElementById('menuButton'),nav=document.querySelector('.navigation');if(b)b.onclick=()=>nav.style.display=nav.style.display==='flex'?'':'flex';</script></body></html>
