<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Luxury Grand Hotel | GhorCast</title><link rel="stylesheet" href="style.css"><style>.hotel-detail{padding:70px 0}.hotel-detail-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:start}.hotel-detail-image{min-height:520px;border-radius:24px;background:url('https://images.unsplash.com/photo-1564501049412-61c2a3083791?auto=format&fit=crop&w=1400&q=85') center/cover}.hotel-detail-card{padding:35px;border-radius:24px;background:#fff;box-shadow:0 15px 45px rgba(0,0,0,.1)}.hotel-detail-card h1{margin:8px 0 10px}.hotel-meta{color:#777;line-height:1.8}.booking-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.booking-fields label{font-size:13px;font-weight:600}.booking-fields input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:9px;margin-top:6px}.book-button{display:block;text-align:center;background:#17202a;color:#fff;padding:15px;border-radius:10px;margin-top:22px;border:0;width:100%;cursor:pointer;font-size:16px}.book-button:hover{background:#c79a4b}@media(max-width:800px){.hotel-detail-grid{grid-template-columns:1fr}.hotel-detail-image{min-height:350px}.booking-fields{grid-template-columns:1fr}}</style></head><body><header class="header"><div class="container nav-container"><a href="index.html" class="logo"><span>Ghor</span><strong>Cast</strong></a><nav class="navigation"><a href="hotels.html">Hotels</a><a href="deals.html">Deals</a><a href="destinations.html">Destinations</a><a href="news.html">News</a><a href="articles.html">Articles</a></nav><button class="menu-button" id="menuButton">☰</button></div></header><section class="hotel-detail"><div class="container hotel-detail-grid"><div class="hotel-detail-image"></div><div class="hotel-detail-card"><p class="eyebrow">DUBAI, UAE</p><h1>Luxury Grand Hotel</h1><div class="rating">★★★★★ <span>4.8</span></div><p class="hotel-meta">A premium hotel experience with comfortable rooms, excellent facilities and convenient access to Dubai's attractions.</p><h3>Choose your room</h3><select id="room" style="width:100%;padding:13px;border:1px solid #ddd;border-radius:9px"><option value="Deluxe Room|120">Deluxe Room — $120/night</option><option value="Executive Room|165">Executive Room — $165/night</option><option value="Grand Suite|220">Grand Suite — $220/night</option></select><div class="booking-fields"><label>Check-in<input type="date" id="checkIn" required></label><label>Check-out<input type="date" id="checkOut" required></label><label style="grid-column:1/-1">Guests<input type="number" id="guests" min="1" value="2" required></label></div><button class="book-button" type="button" onclick="continueBooking()">Continue to Booking</button><a href="hotels.html" style="display:block;text-align:center;margin-top:15px;color:#777;">← Back to Hotels</a></div></div></section><script>const today=new Date().toISOString().split('T')[0],ci=document.getElementById('checkIn'),co=document.getElementById('checkOut'),roomSelect=document.getElementById('room');ci.min=today;co.min=today;ci.addEventListener('change',()=>co.min=ci.value||today);const deal=new URLSearchParams(location.search).get('deal');if(deal&&Number(deal)>0){const first=roomSelect.options[0],name=first.value.split('|')[0],price=Number(deal);first.value=name+'|'+price;first.textContent=name+' — $'+price.toFixed(2)+'/night';roomSelect.value=first.value;}function continueBooking(){if(!ci.value||!co.value){alert('Please select your check-in and check-out dates.');return}if(new Date(co.value)<=new Date(ci.value)){alert('Check-out must be after check-in.');return}const [room,price]=roomSelect.value.split('|'),nights=Math.round((new Date(co.value)-new Date(ci.value))/86400000);localStorage.setItem('ghorcastBooking',JSON.stringify({hotel:'Luxury Grand Hotel',location:'Dubai, UAE',checkIn:ci.value,checkOut:co.value,guests:Number(document.getElementById('guests').value),room,pricePerNight:Number(price),nights,total:nights*Number(price),dealApplied:!!deal}));window.location.href='booking.html'}const b=document.getElementById('menuButton'),n=document.querySelector('.navigation');if(b)b.onclick=()=>n.style.display=n.style.display==='flex'?'':'flex';</script></body></html>
