<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Payment | GhorCast Shop</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #17202a;
        }

        /* HEADER */

        header {
            background: #ffffff;
            border-bottom: 1px solid #e5e5e5;
            padding: 20px 0;
        }

        header .container {
            max-width: 1200px;
            margin: auto;
            padding: 0 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo a {
            text-decoration: none;
            color: #17202a;
            font-size: 21px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .logo strong {
            color: #c79a4b;
        }

        .navigation {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .navigation a {
            text-decoration: none;
            color: #17202a;
            font-size: 14px;
            font-weight: 600;
        }

        .navigation a:hover {
            color: #c79a4b;
        }

        /* PAYMENT AREA */

        .payment-container {
            max-width: 1100px;
            margin: 45px auto;
            padding: 0 25px;
        }

        .payment-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .payment-title h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .payment-title p {
            color: #777;
            font-size: 14px;
        }

        .payment-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .payment-box {
            background: #ffffff;
            padding: 28px;
            border-radius: 10px;
            border: 1px solid #e5e5e5;
        }

        .payment-box h2 {
            font-size: 19px;
            margin-bottom: 22px;
        }

        /* PRODUCT */

        .product-summary {
            display: flex;
            gap: 18px;
            padding-bottom: 22px;
            margin-bottom: 22px;
            border-bottom: 1px solid #eeeeee;
        }

        .product-summary img {
            width: 105px;
            height: 105px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #eeeeee;
        }

        .product-info {
            flex: 1;
        }

        .product-info h3 {
            font-size: 17px;
            margin-bottom: 10px;
        }

        .product-info p {
            font-size: 14px;
            color: #666;
            margin-bottom: 6px;
        }

        .price {
            color: #c79a4b;
            font-weight: 700;
        }

        /* TOTAL */

        .total-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 15px;
        }

        .total-row.final {
            border-top: 1px solid #dddddd;
            margin-top: 10px;
            padding-top: 18px;
            font-size: 19px;
            font-weight: 700;
        }

        /* FORM */

        .form-group {
            margin-bottom: 17px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #d8d8d8;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            border-color: #c79a4b;
        }

        .form-group textarea {
            height: 95px;
            resize: vertical;
        }

        /* PAYMENT METHODS */

        .payment-method {
            margin-top: 25px;
        }

        .payment-method label {
            display: block;
            border: 1px solid #dddddd;
            padding: 13px;
            margin-bottom: 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .payment-method label:hover {
            border-color: #c79a4b;
        }

        .payment-method input {
            margin-right: 8px;
        }

        /* BUTTON */

        .place-order {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #c79a4b;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .place-order:hover {
            background: #b3873e;
        }

        .empty-message {
            text-align: center;
            padding: 60px 20px;
            color: #777;
        }

        .back-button {
            display: inline-block;
            margin-top: 20px;
            padding: 11px 18px;
            background: #17202a;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        /* FOOTER */

        footer {
            margin-top: 60px;
            background: #17202a;
            color: #ffffff;
            padding: 35px 20px;
            text-align: center;
        }

        footer p {
            font-size: 13px;
            color: #cccccc;
        }

        /* MOBILE */

        @media (max-width: 750px) {

            header .container {
                flex-direction: column;
                gap: 18px;
            }

            .navigation {
                gap: 16px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .payment-grid {
                grid-template-columns: 1fr;
            }

            .payment-container {
                margin-top: 30px;
            }

        }

    </style>

</head>

<body>

<!-- HEADER -->

<header>

    <div class="container">

        <div class="logo">

            <a href="products.html">
                GHOR<strong>CAST</strong> SHOP
            </a>

        </div>

        <nav class="navigation">

            <a href="products.html">Home</a>

            <a href="messages.html">Messages</a>

            <a href="cart.html">Cart</a>

            <a href="account.html">Account</a>

        </nav>

    </div>

</header>


<!-- PAYMENT -->

<main class="payment-container">

    <div class="payment-title">

        <h1>Checkout</h1>

        <p>Complete your order securely</p>

    </div>


    <div id="paymentContent">

        <div class="payment-grid">

            <!-- ORDER SUMMARY -->

            <div class="payment-box">

                <h2>Order Summary</h2>

                <div class="product-summary">

                    <img id="productImage"
                         src=""
                         alt="Product">

                    <div class="product-info">

                        <h3 id="productName">
                            Product
                        </h3>

                        <p>
                            Quantity:
                            <span id="productQuantity">
                                1
                            </span>
                        </p>

                        <p>
                            Price:
                            <span class="price"
                                  id="productPrice">
                                $0.00
                            </span>
                        </p>

                    </div>

                </div>


                <div class="total-row">

                    <span>Subtotal</span>

                    <span id="subtotal">
                        $0.00
                    </span>

                </div>


                <div class="total-row">

                    <span>Delivery</span>

                    <span>
                        Free
                    </span>

                </div>


                <div class="total-row final">

                    <span>Total</span>

                    <span id="total">
                        $0.00
                    </span>

                </div>

            </div>


            <!-- CUSTOMER INFORMATION -->

            <div class="payment-box">

                <h2>Customer Information</h2>

                <form id="paymentForm">

                    <div class="form-group">

                        <label>
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="customerName"
                            required
                            placeholder="Enter your full name">

                    </div>


                    <div class="form-group">

                        <label>
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="customerPhone"
                            required
                            placeholder="Enter your phone number">

                    </div>


                    <div class="form-group">

                        <label>
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="customerEmail"
                            placeholder="Enter your email">

                    </div>


                    <div class="form-group">

                        <label>
                            Delivery Address
                        </label>

                        <textarea
                            id="customerAddress"
                            required
                            placeholder="Enter your complete delivery address"></textarea>

                    </div>


                    <div class="payment-method">

                        <h2>
                            Payment Method
                        </h2>

                        <label>

                            <input
                                type="radio"
                                name="payment"
                                value="Cash on Delivery"
                                checked>

                            Cash on Delivery

                        </label>


                        <label>

                            <input
                                type="radio"
                                name="payment"
                                value="bKash">

                            bKash

                        </label>


                        <label>

                            <input
                                type="radio"
                                name="payment"
                                value="Nagad">

                            Nagad

                        </label>


                        <label>

                            <input
                                type="radio"
                                name="payment"
                                value="Card">

                            Debit / Credit Card

                        </label>

                    </div>


                    <button
                        type="submit"
                        class="place-order">

                        Place Order

                    </button>

                </form>

            </div>

        </div>

    </div>

</main>


<!-- FOOTER -->

<footer>

    <p>
        © 2026 GhorCast Shop. All rights reserved.
    </p>

</footer>


<script>


    /* ================================
       LOAD ORDER SOURCE
    ================================= */

    const checkoutSource =
        localStorage.getItem(
            "ghorcastCheckoutSource"
        );


    const buyNowItem =
        JSON.parse(
            localStorage.getItem(
                "ghorcastBuyNow"
            )
        );


    const cartOrder =
        JSON.parse(
            localStorage.getItem(
                "ghorcastOrder"
            )
        );


    let orderItems = [];

    let orderTotal = 0;

    let isCartOrder = false;


    /* ================================
       DETERMINE ORDER
    ================================= */

    if (
        checkoutSource === "cart" &&
        cartOrder &&
        Array.isArray(cartOrder.items) &&
        cartOrder.items.length > 0
    ) {

        isCartOrder = true;

        orderItems =
            cartOrder.items;

        orderTotal =
            Number(
                cartOrder.total ||
                cartOrder.subtotal ||
                0
            );

    } else if (buyNowItem) {

        orderItems = [
            buyNowItem
        ];

        orderTotal =
            Number(
                buyNowItem.price
            ) *
            Number(
                buyNowItem.quantity
            );

    }


    /* ================================
       EMPTY ORDER
    ================================= */

    if (
        orderItems.length === 0
    ) {

        document.getElementById(
            "paymentContent"
        ).innerHTML = `

            <div class="payment-box empty-message">

                <h2>
                    No product selected
                </h2>

                <p>
                    Please add a product
                    before continuing.
                </p>

                <a
                    href="products.html"
                    class="back-button">

                    Back to Shop

                </a>

            </div>

        `;

    } else {


        /* ================================
           CUSTOMER INFORMATION
        ================================= */

        const customer =
            JSON.parse(
                localStorage.getItem(
                    "ghorcastCustomer"
                )
            ) || {};


        if (customer.firstName) {

            document.getElementById(
                "customerName"
            ).value =
                (
                    customer.firstName +
                    " " +
                    (
                        customer.lastName ||
                        ""
                    )
                ).trim();

        }


        if (customer.phone) {

            document.getElementById(
                "customerPhone"
            ).value =
                customer.phone;

        }


        if (customer.email) {

            document.getElementById(
                "customerEmail"
            ).value =
                customer.email;

        }


        if (customer.address) {

            let fullAddress =
                customer.address;


            if (customer.city) {

                fullAddress +=
                    ", " +
                    customer.city;

            }


            if (customer.state) {

                fullAddress +=
                    ", " +
                    customer.state;

            }


            if (customer.postalCode) {

                fullAddress +=
                    ", " +
                    customer.postalCode;

            }


            if (customer.country) {

                fullAddress +=
                    ", " +
                    customer.country;

            }


            document.getElementById(
                "customerAddress"
            ).value =
                fullAddress;

        }


        /* ================================
           ORDER SUMMARY
        ================================= */

        const productSummary =
            document.querySelector(
                ".product-summary"
            );


        if (orderItems.length === 1) {

            const item =
                orderItems[0];


            document.getElementById(
                "productImage"
            ).src =
                item.image || "";


            document.getElementById(
                "productName"
            ).textContent =
                item.name ||
                "Product";


            document.getElementById(
                "productQuantity"
            ).textContent =
                item.quantity || 1;


            document.getElementById(
                "productPrice"
            ).textContent =
                "$" +
                Number(
                    item.price || 0
                ).toFixed(2);

        } else {


            /* ============================
               MULTIPLE CART PRODUCTS
            ============================= */

            productSummary.innerHTML =
                "";


            productSummary.style.display =
                "block";


            orderItems.forEach(
                function(item) {

                    const row =
                        document.createElement(
                            "div"
                        );


                    row.style.display =
                        "flex";

                    row.style.alignItems =
                        "center";

                    row.style.gap =
                        "15px";

                    row.style.padding =
                        "12px 0";

                    row.style.borderBottom =
                        "1px solid #eeeeee";


                    row.innerHTML = `

                        <img
                            src="${item.image || ""}"
                            alt="${item.name || "Product"}"
                            style="
                                width:75px;
                                height:75px;
                                object-fit:cover;
                                border-radius:8px;
                                border:1px solid #eeeeee;
                            "
                        >

                        <div
                            style="
                                flex:1;
                            "
                        >

                            <h3
                                style="
                                    font-size:16px;
                                    margin-bottom:7px;
                                "
                            >
                                ${item.name || "Product"}
                            </h3>

                            <p
                                style="
                                    font-size:14px;
                                    color:#666;
                                    margin-bottom:5px;
                                "
                            >
                                Quantity:
                                ${item.quantity || 1}
                            </p>

                            <p
                                style="
                                    font-size:14px;
                                    color:#c79a4b;
                                    font-weight:700;
                                "
                            >
                                $
                                ${
                                    (
                                        Number(
                                            item.price || 0
                                        ) *
                                        Number(
                                            item.quantity || 1
                                        )
                                    ).toFixed(2)
                                }
                            </p>

                        </div>

                    `;


                    productSummary.appendChild(
                        row
                    );

                }
            );

        }


        /* ================================
           TOTAL
        ================================= */

        document.getElementById(
            "subtotal"
        ).textContent =
            "$" +
            orderTotal.toFixed(2);


        document.getElementById(
            "total"
        ).textContent =
            "$" +
            orderTotal.toFixed(2);


        /* ================================
           PLACE ORDER
        ================================= */

        document.getElementById(
            "paymentForm"
        ).addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const name =
                    document.getElementById(
                        "customerName"
                    ).value.trim();


                const phone =
                    document.getElementById(
                        "customerPhone"
                    ).value.trim();


                const email =
                    document.getElementById(
                        "customerEmail"
                    ).value.trim();


                const address =
                    document.getElementById(
                        "customerAddress"
                    ).value.trim();


                const paymentElement =
                    document.querySelector(
                        'input[name="payment"]:checked'
                    );


                if (!name) {

                    alert(
                        "Please enter your name."
                    );

                    return;

                }


                if (!phone) {

                    alert(
                        "Please enter your phone number."
                    );

                    return;

                }


                if (!address) {

                    alert(
                        "Please enter your delivery address."
                    );

                    return;

                }


                if (!paymentElement) {

                    alert(
                        "Please select a payment method."
                    );

                    return;

                }


                const payment =
                    paymentElement.value;


                /* ============================
                   CREATE ORDER
                ============================= */

                const firstItem =
                    orderItems[0];


                const orderId =
                    "GC-" +
                    Date.now();


                const order = {

                    orderId:
                        orderId,


                    productId:
                        firstItem.id ||
                        "",


                    productName:
                        orderItems.length === 1
                            ? (
                                firstItem.name ||
                                "Product"
                            )
                            :
                            (
                                firstItem.name ||
                                "Product"
                            ) +
                            (
                                orderItems.length > 1
                                    ? " +" +
                                      (
                                          orderItems.length -
                                          1
                                      ) +
                                      " more"
                                    : ""
                            ),


                    image:
                        firstItem.image ||
                        "",


                    price:
                        Number(
                            firstItem.price ||
                            0
                        ),


                    quantity:
                        orderItems.length === 1
                            ? Number(
                                firstItem.quantity ||
                                1
                            )
                            : orderItems.reduce(
                                function(
                                    total,
                                    item
                                ) {

                                    return (
                                        total +
                                        Number(
                                            item.quantity ||
                                            1
                                        )
                                    );

                                },
                                0
                            ),


                    total:
                        orderTotal,


                    items:
                        orderItems,


                    customerName:
                        name,


                    customerPhone:
                        phone,


                    customerEmail:
                        email,


                    customerAddress:
                        address,


                    paymentMethod:
                        payment,


                    status:
                        "Order Received",


                    date:
                        new Date().toISOString()

                };


                /* ============================
                   SAVE ORDER
                ============================= */

                const orders =
                    JSON.parse(
                        localStorage.getItem(
                            "ghorcastOrders"
                        )
                    ) || [];


                orders.push(
                    order
                );


                localStorage.setItem(
                    "ghorcastOrders",
                    JSON.stringify(
                        orders
                    )
                );


                /* ============================
                   CLEAR PURCHASED CART
                ============================= */

                if (isCartOrder) {

                    localStorage.removeItem(
                        "ghorcastCart"
                    );

                    localStorage.removeItem(
                        "ghorcastCheckoutCart"
                    );

                }


                /* ============================
                   CLEAR TEMPORARY CHECKOUT DATA
                ============================= */

                localStorage.removeItem(
                    "ghorcastBuyNow"
                );


                localStorage.removeItem(
                    "ghorcastOrder"
                );


                localStorage.removeItem(
                    "ghorcastCheckoutSource"
                );


                /* ============================
                   ORDER CONFIRMATION
                ============================= */

                document.getElementById(
                    "paymentContent"
                ).innerHTML = `

                    <div
                        class="payment-box empty-message"
                        style="
                            max-width:650px;
                            margin:0 auto;
                        "
                    >

                        <div
                            style="
                                font-size:55px;
                                margin-bottom:15px;
                            "
                        >
                            ✓
                        </div>


                        <h2
                            style="
                                color:#17202a;
                                margin-bottom:15px;
                            "
                        >
                            Order Received
                        </h2>


                        <p
                            style="
                                margin-top:10px;
                            "
                        >
                            Thank you,
                            <strong>
                                ${name}
                            </strong>!
                        </p>


                        <p
                            style="
                                margin-top:10px;
                            "
                        >
                            Your order has been
                            received successfully.
                        </p>


                        <p
                            style="
                                margin-top:15px;
                            "
                        >
                            Order ID:
                            <strong>
                                ${orderId}
                            </strong>
                        </p>


                        <p
                            style="
                                margin-top:10px;
                            "
                        >
                            Total:
                            <strong>
                                $${orderTotal.toFixed(2)}
                            </strong>
                        </p>


                        <p
                            style="
                                margin-top:10px;
                            "
                        >
                            Payment Method:
                            <strong>
                                ${payment}
                            </strong>
                        </p>


                        <div
                            style="
                                margin-top:25px;
                            "
                        >

                            <a
                                href="account.html"
                                class="back-button"
                                style="
                                    margin-right:8px;
                                "
                            >
                                View My Orders
                            </a>


                            <a
                                href="products.html"
                                class="back-button"
                            >
                                Continue Shopping
                            </a>

                        </div>

                    </div>

                `;

            }
        );

    }


</script>
